name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment
        required: true
        type: string
        default: dev
      node-version:
        description: Node.js version to use
        required: false
        type: string
        default: '18'
    secrets:
      api-token:
        description: Token used by the workflow
        required: false
      deploy-key:
        description: Optional deployment key
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Use secrets
        env:
          API_TOKEN: ${{ secrets.api-token }}
          DEPLOY_KEY: ${{ secrets.deploy-key }}
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "API token is set: ${API_TOKEN:+yes}"
          echo "Deploy key is set: ${DEPLOY_KEY:+yes}"
