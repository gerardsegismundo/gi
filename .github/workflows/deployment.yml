name: Test Project
on: [push, workflow_dispatch]
env:
  NODE_ENV: production

jobs:
  test:
    # environment:
    # name: Test Project
    # url: http://localhost:8080
    env:
      PORT: 8080
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: "deps-node-modules-${{ hashFiles('**/package-lock.json') }}"
      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Run server
        run: npm start & npx wait-on http://localhost:$PORT
      - name: Run tests
        continue-on-error: true
        id: run-tests
        run: npm test
      - name: Upload test report
        if: failure() && steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: test-report.json

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      script-file: '${{ steps.publish.outputs.script-file }}'
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: "deps-node-modules-${{ hashFiles('**/package-lock.json') }}"
      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build Project
        run: npm run build
      - name: Publish JS filename
        id: publish
        run: |
          find dist/assets/*.js -exec basename {} \; | head -1 | sed 's/.js$//' | awk '{print script-file= $0}' >> $GITHUB_OUTPUT
          # find dist/assets/*.js -type f -execdir echo 'script-file={}' >> $GITHUB_OUTPUT ';'
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist-files
          path: dist
          # path: |
          #   dist
          #   package.json
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist-files
      - name: Output information
        run: |
          echo 'Node Environment: ${{ env.NODE_ENV }} | Port: ${{ env.PORT }}'
      - name: Output contents
        run: ls -la dist
      - name: Output filename
        run: echo '${{ needs.build.outputs.script-file }}'
      - name: Get code
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Build Project
        run: npm run build
      - name: Deploy
        run: echo "Deploying...."
  report:
    needs: [test, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Get test report
        uses: actions/download-artifact@v3
        with:
          name: test-report
      - name: Output test report
        run: cat test-report.json
