name: Test Project
on: [push, workflow_dispatch]
env:
  NODE_ENV: production

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: "deps-node-modules-${{ hashFiles('**/package-lock.json') }}"
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        if: steps['cache-deps'].outputs.cache-hit != 'true'
        run: npm ci
      - name: Run linter
        run: npm run lint
  test:
    needs: lint
    env:
      PORT: 8080
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: "deps-node-modules-${{ hashFiles('**/package-lock.json') }}"
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Run server
        run: |
          npm start &
          npx wait-on http://localhost:$PORT
      - name: Run tests
        run: npm test
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      script-file: "${{ steps.publish.outputs.script-file }}"
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: "deps-node-modules-${{ hashFiles('**/package-lock.json') }}"
      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build Project
        run: npm run build
      - name: Publish JS filename
        id: publish
        run: |
          find dist/assets/*.js -exec basename {} \; | head -1 | sed 's/.js$//' | awk '{print "script-file="$0}' >> $GITHUB_OUTPUT
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
      - name: Output information
        run: echo 'Node Environment: ${{ env.NODE_ENV }}'
      - name: Output contents
        run: ls -la dist
      - name: Output filename
        run: echo '${{ needs.build.outputs.script-file }}'
      - name: Deploy
        run: echo "Deploying...."
